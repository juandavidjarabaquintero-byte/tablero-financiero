<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tablero Financiero</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tablero">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a0f2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar de módulos desplegables + panel de trabajo; en móvil el menú es un cajón y hay botón flotante de registro */
:root{
  --bg:#0a0f2e; --bg2:#0e1540; --panel:#131b4d; --panel2:#19235e; --line:#28357a; --line2:#34439a;
  --fg:#e9edff; --mut:#93a0d6; --dim:#6773ad;
  --cyan:#2ee6f0; --teal:#24d6a5; --violet:#7b6dff; --gold:#f2c75c; --warn:#ffad4d; --bad:#ff5c7c; --ok:#24d6a5;
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#1d2577 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#13205e 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:linear-gradient(180deg,#121a4f 0%,#0d1440 100%);border-right:1px solid var(--line);padding:18px 12px 24px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 10px}
.brand .mk{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--cyan);display:grid;place-items:center;box-shadow:0 0 18px #2ee6f055 inset,0 0 12px #2ee6f033}
.brand b{font:700 15px/1.1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;display:block}
.brand small{color:var(--mut);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:10px 10px;border:0;background:transparent;border-radius:10px;text-align:left;color:var(--fg);font:600 12.5px/1.2 var(--f-disp);letter-spacing:.07em;text-transform:uppercase}
.nv svg{flex:none;width:19px;height:19px;stroke:var(--mut)}
.nv .chev{margin-left:auto;width:15px;height:15px;transition:transform .2s}
.nv[aria-expanded="true"] .chev{transform:rotate(90deg)}
.nv:hover{background:#ffffff0a}
.nv.on{background:linear-gradient(90deg,#2ee6f022,#2ee6f005);box-shadow:inset 2px 0 0 var(--cyan)}
.nv.on svg{stroke:var(--cyan)}
.subs{display:flex;flex-direction:column;gap:1px;padding:2px 0 8px 40px}
.subs[hidden]{display:none!important}
.sb{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;color:var(--mut);font-size:13.5px;font-weight:500}
.sb:hover{color:var(--fg);background:#ffffff08}
.sb.on{color:var(--cyan);background:#2ee6f012}
.side-foot{margin-top:auto;border:1px solid var(--line2);border-radius:var(--r);padding:14px;background:linear-gradient(160deg,#1d2a78,#141c55);display:grid;gap:8px}
.side-foot .lbl{font:600 10.5px var(--f-disp);letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.side-foot .big{font:700 22px var(--f-disp);font-variant-numeric:tabular-nums}
/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));background:#0a0f2ee6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ham{display:none;border:1px solid var(--line2);background:var(--panel);border-radius:10px;width:40px;height:40px;place-items:center}
.ham svg{width:20px;height:20px;stroke:var(--fg)}
.crumb{min-width:0}
.crumb small{display:block;color:var(--mut);font:600 10.5px var(--f-disp);letter-spacing:.14em;text-transform:uppercase}
.crumb h1{margin:0;font:700 19px/1.2 var(--f-disp);letter-spacing:.03em;text-wrap:balance;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.off .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.pill.sync .dot{background:var(--cyan);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.view{padding:22px max(18px,env(safe-area-inset-right,0px)) 110px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}
/* Cards & KPIs */
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.k3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font:600 12px var(--f-disp);letter-spacing:.13em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font:500 12px var(--f-body)}
.kpi{position:relative;overflow:hidden}
.kpi .l{font:600 11px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font:700 25px/1.15 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:.01em;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:4px}
.kpi::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:linear-gradient(90deg,var(--c,var(--cyan)),transparent);opacity:.85}
.c-cy{--c:var(--cyan)}.c-te{--c:var(--teal)}.c-vi{--c:var(--violet)}.c-go{--c:var(--gold)}.c-ba{--c:var(--bad)}.c-wa{--c:var(--warn)}
.pos{color:var(--teal)}.neg{color:var(--bad)}.gold{color:var(--gold)}.mut{color:var(--mut)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px}
/* Toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke:currentColor}
.btn:hover{border-color:var(--cyan)}
a.btn{text-decoration:none;color:inherit}
.btn.pri{background:linear-gradient(90deg,#16b9c8,#5c62ff);border-color:transparent;color:#fff;box-shadow:0 4px 18px #2ee6f033}
.btn.gh{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.dan{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--mut)}
.chip.on{color:#05202a;background:var(--cyan);border-color:var(--cyan)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:#ffffff10;color:var(--mut);white-space:nowrap}
.tag.gasto{background:#ff5c7c1f;color:#ff8ea4}.tag.costo{background:#ffad4d1f;color:#ffc27e}.tag.inversion{background:#7b6dff26;color:#b0a8ff}.tag.ingreso{background:#24d6a51f;color:#5fe8c2}.tag.anticipo{background:#2ee6f01a;color:#7cf0f6}
.tag.ok{background:#24d6a51f;color:#5fe8c2}.tag.wa{background:#ffad4d1f;color:#ffc27e}.tag.ba{background:#ff5c7c1f;color:#ff8ea4}
.search{flex:1;min-width:160px;max-width:320px;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:9px 12px}
/* Tables */
.tw{overflow-x:auto;border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font:600 10.5px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid #ffffff0d;vertical-align:top}
.t tr.rw:hover td{background:#ffffff06}
.t td.n,.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t tfoot td{font-weight:700;border-top:1px solid var(--line2);border-bottom:0}
.t .acts{white-space:nowrap;text-align:right}
.ib{border:0;background:transparent;padding:5px;border-radius:7px;color:var(--mut)}
.ib svg{width:17px;height:17px;stroke:currentColor;display:block}
.ib:hover{color:var(--cyan);background:#ffffff0c}
.ib.dan:hover{color:var(--bad)}
.empty{padding:28px 12px;text-align:center;color:var(--mut)}
/* Person / entity cards */
.ent{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ec{background:linear-gradient(165deg,#1b2564,#141c52);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.ec .hd{display:flex;align-items:flex-start;gap:10px}
.ec .hd b{font-weight:700;font-size:14.5px;line-height:1.25}
.ec .hd small{display:block;color:var(--mut);font-size:12px}
.ec .hd .tag{margin-left:auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
.kv span:nth-child(even){font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.ec .bar{gap:6px}
.meter{height:6px;border-radius:9px;background:#ffffff12;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--cyan))}
/* Rings */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.ring{display:grid;justify-items:center;gap:6px;text-align:center}
.ring svg{width:92px;height:92px}
.ring b{font-size:12.5px;font-weight:600}
.ring small{color:var(--mut);font-size:11.5px;font-family:var(--f-mono)}
/* Alerts */
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #ffffff0d;font-size:13.5px}
.al:last-child{border-bottom:0}
.al i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.al.ba i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.al.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font:11px var(--f-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* Modal */
.modal{position:fixed;inset:0;z-index:80;background:#04071acc;backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.sheet{width:min(620px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:linear-gradient(170deg,#1b2566,#121a4c);border:1px solid var(--line2);border-radius:18px;box-shadow:0 20px 60px #0008,0 0 0 1px #2ee6f011}
.sheet .sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:16px 18px;background:#1a2463f2;border-bottom:1px solid var(--line)}
.sheet .sh h2{margin:0;font:700 16px var(--f-disp);letter-spacing:.04em}
.sheet .sh .ib{margin-left:auto}
.sheet .sbd{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.sheet .sft{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:#141c52f2;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld.w{grid-column:1/-1}
.fld label{font:600 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:11px 12px;font-size:16px}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--cyan);outline:0;box-shadow:0 0 0 3px #2ee6f022}
.fld .hint{font-size:12px;color:var(--dim)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font:500 13.5px var(--f-body);letter-spacing:0;text-transform:none;color:var(--fg)}
.checks input{width:auto;accent-color:var(--cyan)}
.prev{border:1px dashed var(--line2);border-radius:12px;padding:12px;background:#0a0f2e80}
.photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line2)}
.viewer img{width:100%;border-radius:10px}
/* Quick FAB */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#19c9d6,#6a5cff);box-shadow:0 8px 28px #2ee6f055;display:none;place-items:center}
.fab svg{width:26px;height:26px;stroke:#fff}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.qgrid h4{grid-column:1/-1;margin:8px 0 0;font:600 11px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#1d2a78;border:1px solid var(--cyan);color:var(--fg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px #0008;max-width:calc(100% - 32px)}
.scrim{display:none}
.note{font-size:13px;color:var(--mut);border-left:2px solid var(--violet);padding:4px 0 4px 12px}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hstat{display:flex;gap:18px;flex-wrap:wrap}
.hstat div{display:grid}
.hstat small{color:var(--mut);font:600 10.5px var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
.hstat b{font:700 18px var(--f-disp);font-variant-numeric:tabular-nums}
.ac{background:linear-gradient(165deg,#1b2564,#141c52);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;min-width:0}
.ac-ph,.hero,.avatar{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 80% 0%,#2a3a9a 0%,#141c52 65%)}
.ac-ph{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:0;padding:0;cursor:pointer}
.ac-ph img,.hero img,.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.ac-ph img:not([src]),.hero img:not([src]),.avatar img:not([src]){display:none}
.ac-ph:hover img{transform:scale(1.04)}
.phc{position:absolute;inset:0;display:grid;place-items:center}
.phc svg{width:46px;height:46px;stroke:#2ee6f099}
img[src]~.phc{display:none}
.ac-ph::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,#0a0f2ed9);pointer-events:none}
.ac-ph .badge{position:absolute;left:10px;bottom:10px;z-index:1;max-width:calc(100% - 20px)}
.ac-ph .badge .tag{white-space:normal;text-align:left}
.ac-bd{padding:14px;display:grid;gap:8px;min-width:0}
.ac-bd .hd b{font-weight:700;font-size:15px}
.ac-bd .hd small{display:block;color:var(--mut);font-size:12.5px}
.hero{width:100%;max-width:100%;aspect-ratio:16/9;max-height:340px;border-radius:14px}
.hero .phc svg{width:72px;height:72px}
.hero .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:16px;background:linear-gradient(transparent,#0a0f2ef2 70%);display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.hero .cap b{display:block;font:700 22px/1.2 var(--f-disp);letter-spacing:.02em}
.hero .cap .btn{margin-left:auto}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;border:1.5px solid var(--cyan);padding:0;cursor:pointer}
.avatar .phc svg{width:24px;height:24px}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line2)}
.sheet.wide{width:min(780px,100%)}
.sbd h3.sec{margin:0 0 4px;font:600 12px var(--f-disp);letter-spacing:.13em;text-transform:uppercase;color:var(--mut)}
.obl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid #ffffff0f}
.obl:last-child{border-bottom:0}
.obl .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;text-align:left}
.prev .tag{margin-right:6px}
.chart.wide svg{max-height:360px}
.cols2{columns:2 320px;column-gap:28px}
.cols2>div{break-inside:avoid}
.dl{display:inline-block;margin-left:8px;font:700 12px var(--f-body);color:var(--mut);vertical-align:4px}
.dl.up{color:var(--teal)}.dl.dn{color:var(--bad)}
.al.in i{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
table.pyg tr.sub td{font-weight:700}
table.pyg tr.total td{font-weight:800;border-top:1px solid var(--line2);background:#2ee6f00d}
table.pyg tr.nota td{color:var(--mut);font-style:italic}
.donut{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:center;justify-items:center}
.donut .dlist{justify-self:stretch}
.donut svg{width:100%;height:auto;max-width:220px}
.dlist{display:grid;gap:7px;min-width:0}
.dlist div{display:grid;grid-template-columns:10px minmax(70px,1fr) auto auto;gap:8px;align-items:center;font-size:13px}
.dlist i{width:10px;height:10px;border-radius:3px}
.dlist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist b{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.dlist small{color:var(--mut);font-family:var(--f-mono);min-width:34px;text-align:right}
.hb{display:grid;gap:5px;margin-bottom:12px;font-size:13.5px}
.hb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.donut{grid-template-columns:minmax(0,1fr)}.donut svg{margin:0 auto}}
.pk{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0;color:transparent}
.pk svg{width:16px;height:16px;stroke:currentColor}

const thisMonth=()=>today().slice(0,7);
function rowActs(c,id,extra=''){
 return `<td class="acts">${extra}<button class="ib edit-only" data-act="edit" data-c="${c}" data-id="${id}" title="Editar">${ic('edit')}</button><button class="ib dan del-only" data-act="del" data-c="${c}" data-id="${id}" title="Eliminar">${ic('trash')}</button></td>`}
const photoBtn=r=>r.foto?`<button class="ib" data-act="foto" data-id="${r.foto}"${r.fotoDrive?` data-drive="${r.fotoDrive}"`:''} title="Ver soporte">${ic('cam')}</button>`:(r.fotoN?`<span class="tag" title="Soporte en Drive">${esc(r.fotoN.length>18?r.fotoN.slice(0,16)+'…':r.fotoN)}</span>`:'');
const PICK=new Set();
const trasBtn=r=>r.s==='nomina'?'':`<button class="ib edit-only" data-act="tras" data-id="${r.id}" title="Trasladar a otro proyecto o categoría">${ic('move')}</button>`;
function movTable(rows,opt={}){
 const q=V.q.toLowerCase();const sel=V.sel&&!opt.noActs&&canEdit();const full=opt.full;
 if(q)rows=rows.filter(r=>[r.concepto,r.tercero,r.cat,r.cedula,r.resp].join(' ').toLowerCase().includes(q));
 rows=rows.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.cre-a.cre);
 if(!rows.length)return `<div class="empty">${q?'Sin resultados para la búsqueda.':'Aún no hay registros aquí. Usa “Registrar” para agregar el primero.'}</div>`;
 const showP=opt.showP;
 return `<div class="tw"><table class="t cards"><thead><tr>${sel?`<th><button class="ib" data-act="pickAll" data-ids="${rows.filter(r=>r.s!=='nomina').map(r=>r.id).join(',')}" title="Seleccionar todos">${ic('check')}</button></th>`:''}<th>Fecha</th>${showP||full?'<th>Proyecto</th>':''}${full?'<th>Rubro</th>':''}<th>Concepto</th>${showP&&!full?'':'<th>Categoría</th>'}<th>${opt.tl||'Proveedor / beneficiario'}</th><th>Tipo</th><th class="n">Valor</th><th></th></tr></thead><tbody>
 ${rows.map(r=>`<tr class="rw${PICK.has(r.id)?' picked':''}">${sel?`<td>${r.s==='nomina'?'':`<button class="pk ${PICK.has(r.id)?'on':''}" data-act="pick" data-id="${r.id}" aria-label="Seleccionar">${ic('check')}</button>`}</td>`:''}<td data-l="Fecha" class="num">${fd(r.fecha)}</td>${showP||full?`<td data-l="Proyecto">${esc(r.p==='inm'?(byId('inm',r.inm)?.nombre||'Inmuebles'):PNAME[r.p]||r.p)}</td>`:''}${full?`<td data-l="Rubro">${esc(subOf(r.p,r.s)?.name||r.s)}</td>`:''}<td class="p">${esc(r.concepto||'—')}${r.arrTipo?`<div style="margin-top:3px"><span class="tag">${esc(r.arrTipo)}${r.arrDesc?' · '+esc(r.arrDesc):''}${r.arrMes?' · '+MES[+r.arrMes.slice(5)-1]+' '+r.arrMes.slice(0,4):''}</span></div>`:''}${r.nota?`<div class="mut" style="font-size:12px;font-weight:400">${esc(r.nota)}</div>`:''}</td>${showP&&!full?'':`<td data-l="Cat.">${esc(r.cat||'')}</td>`}<td data-l="Tercero">${esc(r.tercero||'')}${r.cedula?` <span class="mut num">CC ${esc(r.cedula)}</span>`:''}</td><td>${tagN(r.nat)}</td><td class="n">${fmt(r.valor)}</td>${opt.noActs?'<td></td>':rowActs('mov',r.id,photoBtn(r)+trasBtn(r))}</tr>`).join('')}
 </tbody><tfoot><tr><td colspan="${5+(sel?1:0)+(full?1:0)+(full&&!showP?1:0)}">${rows.length} registro${rows.length===1?'':'s'}</td><td class="n">${fmt(sum(rows))}</td><td></td></tr></tfoot></table></div>`;
}
function catChips(cats,key){
 const cur=V.f[key]||'';const [m,sb]=key.split('.');const cus=customCats(m,sb).map(c=>c.name);
 return `<div class="chips"><button class="chip ${!cur?'on':''}" data-act="fcat" data-k="${key}" data-v="">Todas</button>${cats.map(c=>`<button class="chip ${cur===c?'on':''}" data-act="fcat" data-k="${key}" data-v="${esc(c)}"${cus.includes(c)?' title="Categoría personalizada"':''}>${esc(c)}${cus.includes(c)?' ·':''}</button>`).join('')}<button class="chip edit-only" data-act="newCat" data-m="${m}" data-s="${sb}">+ Categoría</button></div>`;
}
function toolbar(btns,mov=true){return `<div class="bar">${btns}${mov?`<button class="btn gh edit-only" data-act="selMode">${ic('check')}${V.sel?'Cancelar selección':'Seleccionar'}</button>${V.sel&&PICK.size?`<button class="btn pri edit-only" data-act="trasSel">${ic('move')}Trasladar ${PICK.size}</button>`:''}`:''}<input class="search" id="q" placeholder="Buscar concepto, nombre o cédula" aria-label="Buscar"></div>`}

/* ---------- vista genérica de un rubro ---------- */
function inmSel(){
 const list=L('inm');if(!V.inm||!list.find(i=>i.id===V.inm))V.inm=list[0]?.id||'';
 const cur=list.find(i=>i.id===V.inm);
 return `<div class="card"><div class="split"><div class="chips">${list.map(i=>`<button class="chip ${i.id===V.inm?'on':''}" data-act="inm" data-id="${i.id}">${esc(i.nombre)}</button>`).join('')}</div>
 <div class="bar"><button class="btn sm gh edit-only" data-act="newInm">${ic('plus')}Nueva propiedad</button>${cur?`<button class="btn sm gh edit-only" data-act="edit" data-c="inm" data-id="${cur.id}">${ic('edit')}Editar</button>`:''}</div></div>
 ${cur?(()=>{const ej=sum(L('mov').filter(r=>r.p==='inm'&&r.inm===cur.id&&r.nat!=='anticipo'));const pct=cur.pres?ej/cur.pres*100:0;
  return `<div class="bar" style="margin-top:14px;flex-wrap:nowrap"><button class="avatar" data-act="ficha" data-c="inm" data-id="${cur.id}" aria-label="Ver ficha de ${esc(cur.nombre)}">${phBox(cur,'inm')}</button><div style="min-width:0;flex:1"><b>${esc(cur.nombre)}</b><div class="mut" style="font-size:12.5px">${esc(ASSET.inm.sub(cur))||'Inmueble'}</div><div style="margin-top:4px">${oblTag(nextObl('inm',cur.id))}</div></div><button class="btn sm gh" data-act="ficha" data-c="inm" data-id="${cur.id}">${ic('eye')}Ficha</button></div><div class="hstat" style="margin-top:14px"><div><small>Presupuesto</small><b>${fmt(cur.pres)}</b></div><div><small>Ejecutado</small><b>${fmt(ej)}</b></div><div><small>Disponible</small><b class="${cur.pres-ej<0?'neg':'pos'}">${fmt(cur.pres-ej)}</b></div><div><small>% ejecutado</small><b class="${pct>90?'neg':''}">${pct.toFixed(1)}%</b></div></div><div class="meter" style="margin-top:10px"><i style="width:${Math.min(100,pct)}%;${pct>100?'background:var(--bad)':''}"></i></div>`})():'<div class="empty">Crea la primera propiedad.</div>'}</div>`;
}
function vGen(m,sub){
 const key=m+'.'+sub.id;const cats=catsOf(m,sub.id);
 let rows=L('mov').filter(r=>r.p===m&&r.s===sub.id&&(m!=='inm'||r.inm===V.inm));
 let pre='';if(m==='inm')pre=inmSel(),rows=L('mov').filter(r=>r.p===m&&r.s===sub.id&&r.inm===V.inm);
 const all=rows;const fc=V.f[key];if(fc)rows=rows.filter(r=>r.cat===fc);
 const mes=sum(all.filter(r=>r.fecha.startsWith(thisMonth())));
 const nat=sub.nat;
 return pre+`<div class="grid k4">${kpi('Total acumulado',fmt(sum(all)),`${all.length} registros`,nat==='inversion'?'c-vi':nat==='costo'?'c-wa':'c-ba')}${kpi('Este mes',fmt(mes),MES[new Date().getMonth()]+' '+new Date().getFullYear(),'c-cy')}${extraK(m,sub,all)}${kpi('Último registro',all.length?fd(all.map(r=>r.fecha).sort().pop()):'—','Clasificación: '+NATL[nat],'c-te')}</div>
 ${arrCard(all)}<div class="card">${toolbar(`<button class="btn pri edit-only" data-act="newMov" data-m="${m}" data-s="${sub.id}">${ic('plus')}Registrar</button>`)}<div style="margin:12px 0">${catChips(cats,key)}</div>${movTable(rows,{tl:sub.tl})}</div>`;
}

function extraK(m,sub,all){
 if(m==='personal'&&sub.id==='familiar'){const iv=all.filter(r=>/^ivanna/i.test(r.cat||''));const y=today().slice(0,4);return kpi('Ivanna',fmt(sum(iv.filter(r=>r.fecha.startsWith(y)))),'En '+y+' · '+fmt(sum(iv.filter(r=>r.fecha.startsWith(thisMonth()))))+' este mes','c-vi')}
 return '';
}
function arrCard(all){
 const a=all.filter(isArr);if(!a.length)return '';const g={};const y=today().slice(0,4);
 a.forEach(r=>{const k=(r.arrTipo||'Sin tipo')+(r.arrDesc?' · '+r.arrDesc:'');(g[k]=g[k]||{y:0,last:'',n:0});if(r.fecha.startsWith(y))g[k].y+=r.valor;g[k].n++;const mm=r.arrMes||r.fecha.slice(0,7);if(mm>g[k].last)g[k].last=mm});
 return `<div class="card"><h3>Arriendos por inmueble<span class="r mut">Pagado en ${y}</span></h3><div class="kv">${Object.entries(g).sort((x,z)=>z[1].y-x[1].y).map(([k,v])=>`<span>${esc(k)}<br><small class="mut">Último mes pagado: ${MES[+v.last.slice(5)-1]} ${v.last.slice(0,4)}</small></span><span>${fmt(v.y)}</span>`).join('')}</div></div>`;
}

/* ---------- vistas especiales ---------- */
const SPV={};
SPV.veh=()=>{
 const vs=L('veh');const rows=L('mov').filter(r=>r.p==='personal'&&r.s==='vehiculos');
 return `<div class="grid k4">${kpi('Gastado en vehículos',fmt(sum(rows.filter(r=>r.nat==='gasto'))),`${rows.length} pagos`,'c-ba')}${kpi('Vehículos',vs.length,'Con foto: '+vs.filter(v=>v.foto).length,'c-cy')}${nextOblKpi('veh')}</div>
 <div class="card"><h3>Vehículos<span class="r"><button class="btn sm edit-only" data-act="newVeh">${ic('plus')}Agregar vehículo</button></span></h3><div class="ent">${vs.map(v=>{const g=rows.filter(r=>r.veh===v.id);const so=L('obl').find(o=>o.aid===v.id&&o.tipo==='SOAT'&&!o.done),te=L('obl').find(o=>o.aid===v.id&&o.tipo==='Revisión técnico-mecánica'&&!o.done);
  return assetCard('veh',v,`<span>SOAT</span><span>${so?oblTag(so,1):'<span class="tag">Sin fecha</span>'}</span><span>Tecnomecánica</span><span>${te?oblTag(te,1):'<span class="tag">Sin fecha</span>'}</span><span>Gastado</span><span>${fmt(sum(g))}</span>`,`<button class="btn sm pri edit-only" data-act="newMov" data-m="personal" data-s="vehiculos" data-veh="${v.id}">${ic('plus')}Registrar pago</button>`)}).join('')||'<div class="empty">Agrega tu primer vehículo.</div>'}</div></div>
 <div class="card"><h3>Pagos de vehículos</h3>${toolbar('')}<div style="margin:12px 0">${catChips(catsOf('personal','vehiculos'),'personal.vehiculos')}</div>${movTable(V.f['personal.vehiculos']?rows.filter(r=>r.cat===V.f['personal.vehiculos']):rows,{tl:'Proveedor'})}</div>`;
};
SPV.cab=()=>{
 const cs=L('cab');const rows=L('mov').filter(r=>r.p==='parcela'&&r.s==='caballos');
 return `<div class="grid k4">${kpi('Gastado en caballos',fmt(sum(rows.filter(r=>r.nat==='gasto'))),`${rows.length} pagos`,'c-ba')}${kpi('Invertido en caballos',fmt(sum(rows.filter(r=>r.nat==='inversion'))),'Compras de caballos','c-vi')}${nextOblKpi('cab')}</div>
 <div class="card"><h3>Caballos<span class="r"><button class="btn sm edit-only" data-act="newCab">${ic('plus')}Agregar caballo</button></span></h3><div class="ent">${cs.map(c=>{const g=rows.filter(r=>r.cab===c.id);const by={};g.forEach(r=>by[r.cat]=(by[r.cat]||0)+r.valor);
 return assetCard('cab',c,`${Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`<span>${esc(k)}</span><span>${fmt(v)}</span>`).join('')}<span><b>Total</b></span><span><b>${fmt(sum(g))}</b></span>`,`<button class="btn sm pri edit-only" data-act="newMov" data-m="parcela" data-s="caballos" data-cab="${c.id}">${ic('plus')}Registrar gasto</button>`)}).join('')||'<div class="empty">Agrega tu primer caballo.</div>'}</div></div>
 <div class="card"><h3>Gastos de caballos</h3>${toolbar('')}<div style="margin:12px 0">${catChips(catsOf('parcela','caballos'),'parcela.caballos')}</div>${movTable(V.f['parcela.caballos']?rows.filter(r=>r.cat===V.f['parcela.caballos']):rows,{tl:'Proveedor / jinete'})}</div>`;
};
SPV.eqv=()=>{
 const es=L('eq');const rows=L('mov').filter(r=>r.p==='mina'&&r.s==='activos');const mant=L('mov').filter(r=>r.p==='mina'&&r.eq&&r.s!=='activos');const fc=V.f['mina.activos'];
 return `<div class="grid k4">${kpi('Invertido en activos',fmt(sum(rows)),`${rows.length} compras`,'c-vi')}${kpi('Equipos registrados',es.length,'Con foto: '+es.filter(e=>e.foto).length,'c-cy')}${kpi('Mantenimiento de equipos',fmt(sum(mant)),'Costos vinculados a equipos','c-wa')}${nextOblKpi('eq')}</div>
 <div class="card"><h3>Equipos de la mina<span class="r"><button class="btn sm edit-only" data-act="newEq">${ic('plus')}Agregar equipo</button></span></h3><div class="ent">${es.map(e=>assetCard('eq',e,`<span>Tipo</span><span>${esc(e.tipo||'—')}</span><span>Valor de compra</span><span>${e.valor?fmt(e.valor):'—'}</span><span>Mantenimiento</span><span>${fmt(sum(mant.filter(r=>r.eq===e.id)))}</span>`,`<button class="btn sm pri edit-only" data-act="newMov" data-m="mina" data-s="herramientas" data-eq="${e.id}" data-cat="Mantenimiento">${ic('tool')}Mantenimiento</button>`)).join('')||'<div class="empty">Registra tus plantas, motobombas, motores y clasificadoras.</div>'}</div></div>
 <div class="card"><h3>Compras de activos</h3>${toolbar(`<button class="btn pri edit-only" data-act="newMov" data-m="mina" data-s="activos">${ic('plus')}Registrar compra</button>`)}<div style="margin:12px 0">${catChips(catsOf('mina','activos'),'mina.activos')}</div>${movTable(fc?rows.filter(r=>r.cat===fc):rows)}</div>`;
};
SPV.nom=()=>{
 const isInm=V.m==='inm';let pre='';if(isInm)pre=inmSel();
 const sc=isInm?'inm:'+V.inm:'parcela';const p=isInm?'inm':'parcela';
 const pers=L('per').filter(x=>x.sc===sc);
 const rows=L('mov').filter(r=>r.p===p&&r.s==='nomina'&&(!isInm||r.inm===V.inm));
 return pre+`<div class="card"><h3>${isInm?'Personal de obra':'Empleados de la parcela'}<span class="r"><button class="btn sm edit-only" data-act="newPer" data-sc="${sc}">${ic('plus')}Agregar persona</button></span></h3><div class="ent">${pers.map(x=>{const g=rows.filter(r=>r.per===x.id);const pag=sum(g);const ade=sum(g.filter(r=>/Adelanto/.test(r.cat)));const ac=x.acordado||0;
 return `<div class="ec"><div class="hd"><div><b>${esc(x.nombre)}</b><small>${esc(x.rol||'')}${x.cedula?' · CC '+esc(x.cedula):''}</small></div>${x.inactivo?'<span class="tag">Retirado</span>':''}</div>
 <div class="kv">${isInm?`<span>Valor acordado</span><span>${ac?fmt(ac):'—'}</span>`:`<span>Salario mensual</span><span>${x.salario?fmt(x.salario):'—'}</span>`}<span>Adelantos</span><span>${fmt(ade)}</span><span>Total pagado</span><span>${fmt(pag)}</span>${isInm&&ac?`<span>Saldo por pagar</span><span class="${ac-pag<0?'neg':'gold'}">${fmt(ac-pag)}</span>`:''}</div>
 ${isInm&&ac?`<div class="meter"><i style="width:${Math.min(100,pag/ac*100)}%"></i></div>`:''}
 <div class="bar"><button class="btn sm pri edit-only" data-act="newNom" data-per="${x.id}">${ic('cash')}Pagar / adelanto</button><button class="btn sm gh edit-only" data-act="edit" data-c="per" data-id="${x.id}">${ic('edit')}</button></div></div>`}).join('')||'<div class="empty">Agrega la primera persona para registrar sus pagos.</div>'}</div></div>
 <div class="card"><h3>Historial de pagos</h3>${toolbar('')}<div style="height:10px"></div>${movTable(rows,{tl:'Persona'})}</div>`;
};
SPV.nomM=()=>{
 const pers=L('per').filter(x=>x.sc==='mina');
 const rows=L('mov').filter(r=>r.p==='mina'&&r.s==='nomina');
 const cuts=L('cortes');
 const totAnt=sum(pers,x=>anticiposPend(x.id));
 const order=Object.keys(MROL);
 pers.sort((a,b)=>order.indexOf(a.rol)-order.indexOf(b.rol)||a.nombre.localeCompare(b.nombre));
 return `<div class="grid k4">${kpi('Anticipos por descontar',fmt(totAnt),'Se descuentan del % en el próximo corte','c-cy')}${kpi('Pagos fijos y coleros',fmt(sum(rows.filter(r=>r.nat==='costo'))),'Costo de la mina','c-wa')}${kpi('Participaciones pagadas',fmt(sum(cuts.flatMap(c=>c.liq||[]).filter(x=>x.key!=='inv'),x=>x.cop)),`${cuts.length} cortes`,'c-go')}${kpi('Personas activas',pers.filter(x=>!x.inactivo).length,'Nómina Mina La Fe','c-te')}</div>
 <div class="card"><h3>Personal de la mina<span class="r"><button class="btn sm edit-only" data-act="newPer" data-sc="mina">${ic('plus')}Agregar persona</button></span></h3><div class="ent">${pers.map(x=>{const g=rows.filter(r=>r.per===x.id);const ro=MROL[x.rol]||{};const pc=S.cfg.pct;const pct=ro.part?pc[ro.part]:0;
 const part=sum(cuts.flatMap(c=>c.liq||[]).filter(l=>l.per===x.id),l=>l.cop);
 return `<div class="ec"><div class="hd"><div><b>${esc(x.nombre)}</b><small>${esc(x.rol)}${x.cedula?' · CC '+esc(x.cedula):''}</small></div><span class="tag ${ro.part?'anticipo':''}">${ro.part?(ro.part==='emp'?pct+'% compartido':pct+'%'):'Sin %'}</span></div>
 <div class="kv">${ro.mensual?`<span>Pago mensual</span><span>${x.salario?fmt(x.salario):'—'}</span>`:''}${ro.part?`<span>Anticipos pendientes</span><span class="gold">${fmt(anticiposPend(x.id))}</span><span>Participación recibida</span><span>${fmt(part)}</span>`:''}<span>Pagos y coleros</span><span>${fmt(sum(g.filter(r=>r.nat==='costo')))}</span></div>
 <div class="bar"><button class="btn sm pri edit-only" data-act="newNom" data-per="${x.id}">${ic('cash')}${ro.part&&!ro.mensual?'Anticipo / colero':'Pagar'}</button><button class="btn sm gh edit-only" data-act="edit" data-c="per" data-id="${x.id}">${ic('edit')}</button></div></div>`}).join('')}</div></div>
 <div class="card"><h3>Historial de pagos de nómina</h3>${toolbar('')}<div style="height:10px"></div>${movTable(rows,{tl:'Persona'})}</div>`;
};
SPV.cortes=()=>{
 const cs=L('cortes').slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
 const pc=S.cfg.pct;const inv=100-pc.ter-pc.emp-pc.com-pc.adm;
 const pend=minaPendiente();
 const oro=sum(cs,c=>c.gramos);
 return `<div class="grid k4">${kpi('Costos por cubrir',fmt(pend),'Gastos y costos de la mina aún sin abonar con cortes','c-wa')}${kpi('Oro lavado',fg(oro)+' g',`${(oro/CAST).toLocaleString('es-CO',{maximumFractionDigits:2})} castellanos · ${cs.length} cortes`,'c-go','gold')}${kpi('Ingreso inversionista',fmt(sum(cs,c=>c.invCop)),inv+'% de cada corte','c-te')}${kpi('Inversión en activos',fmt(sum(L('mov').filter(r=>r.p==='mina'&&r.nat==='inversion'))),'Plantas, motores, clasificadora','c-vi')}</div>
 <div class="card"><div class="split"><h3 style="margin:0">Reparto por corte</h3><div class="bar"><button class="btn sm gh edit-only" data-act="pct">${ic('edit')}Porcentajes</button><button class="btn pri edit-only" data-act="newCorte">${ic('plus')}Registrar lavado de oro</button></div></div>
 <div class="hstat" style="margin-top:12px"><div><small>Dueño terreno</small><b>${pc.ter}%</b></div><div><small>Empleados directos</small><b>${pc.emp}%</b></div><div><small>Comisionista</small><b>${pc.com}%</b></div><div><small>Administrador</small><b>${pc.adm}%</b></div><div><small>Dueño de la mina</small><b class="pos">${inv}%</b></div></div></div>
 ${cs.length?cs.map(c=>`<div class="card"><div class="split"><div><h3 style="margin:0 0 4px">Corte del ${fd(c.fecha)}</h3><div class="mut" style="font-size:13px">${fg(c.gramos)} g · ${fmt(c.precio)} por gramo${c.obs?' · '+esc(c.obs):''}</div></div><div class="bar"><b class="gold" style="font:700 22px var(--f-disp)">${fmt(c.total)}</b><button class="ib dan del-only" data-act="del" data-c="cortes" data-id="${c.id}" title="Eliminar corte">${ic('trash')}</button></div></div>
  <div class="tw" style="margin-top:10px">${liqTable(c.liq)}</div>
  <div class="hstat" style="margin-top:12px"><div><small>Abono a costos</small><b>${fmt(c.abono)}</b></div><div><small>Disponible inversionista</small><b class="pos">${fmt(c.invCop-c.abono)}</b></div>${sum(c.liq||[],l=>l.desc)?`<div><small>Reintegro de anticipos</small><b>${fmt(sum(c.liq||[],l=>l.desc))}</b></div>`:''}<div><small>Pendiente antes del corte</small><b>${fmt(c.pendAntes)}</b></div></div></div>`).join(''):`<div class="card empty">Aún no hay cortes. Cuando laves oro, toca “Registrar lavado de oro”: el reparto se calcula solo y descuenta los anticipos.</div>`}`;
};

const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],MESU=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const fdl=s=>{if(!s)return '';const d=new Date(s+'T12:00:00');return `${DIAS[d.getDay()]} ${s.slice(8,10)} ${MESU[+s.slice(5,7)-1]} ${s.slice(2,4)}`};
const fds=s=>s?`${s.slice(8,10)} ${MESU[+s.slice(5,7)-1]} ${s.slice(2,4)}`:'';
const enCurso=r=>r.hf===''||r.hf==null;
const f1=n=>(+n||0).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:2});
const JC={ok:'#1fe0a0',cerca:'#ffb547',bajo:'#ff4f73',sin:'#8b93b5',curso:'#8b7bff'};
function jst(r){const P=S.retroP;if(enCurso(r))return 'curso';if(!(r.horas>0))return 'sin';if(r.horas>=P.min)return 'ok';if(r.horas>=P.min*(P.alerta||80)/100)return 'cerca';return 'bajo'}
function hoursChart(h){
 const P=S.retroP;const d=h.filter(r=>!enCurso(r)).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(-21);
 if(!d.length)return '<div class="empty">Sin jornadas registradas.</div>';
 const W=640,H=240,pl=8,pr=8,pt=26,pb=34;const mx=Math.max(P.min*1.45,...d.map(r=>r.horas))*1.04;const bw=(W-pl-pr)/d.length;const y=v=>pt+(H-pt-pb)*(1-v/mx);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rendimiento diario de la máquina"><defs><filter id="glw" x="-50%" y="-20%" width="200%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
 d.forEach((r,i)=>{const st=jst(r);const x=pl+i*bw+bw*.12,w=bw*.76;const hh=Math.max(0,y(0)-y(r.horas));if(r.horas>0)s+=`<path d="M${x},${y(0)} V${y(r.horas)+6} q0,-6 6,-6 H${x+w-6} q6,0 6,6 V${y(0)}Z" fill="${JC[st]}" filter="url(#glw)" opacity=".95"><title>${fdl(r.fecha)}: ${f1(r.horas)} h${r.obs?' · '+esc(r.obs):''}</title></path>`;else s+=`<rect x="${x}" y="${y(0)-3}" width="${w}" height="3" rx="1.5" fill="${JC.sin}" opacity=".6"><title>${fdl(r.fecha)}: sin operación${r.obs?' · '+esc(r.obs):''}</title></rect>`;hh});
 s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(P.min)}" y2="${y(P.min)}" stroke="#93a0d6" stroke-opacity=".55" stroke-dasharray="5 5"/><text x="${W-pr}" y="${y(P.min)-7}" text-anchor="end" style="fill:#93a0d6;font:500 13px var(--f-body)">Mín ${fg(P.min)} h</text>`;
 s+=`<text x="${pl}" y="${H-8}" style="fill:#93a0d6;font:500 13px var(--f-body)">${fds(d[0].fecha)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end" style="fill:#93a0d6;font:500 13px var(--f-body)">${fds(d[d.length-1].fecha)}</text></svg>`;
 const cnt=k=>d.filter(r=>jst(r)===k).length;const nov=d.filter(r=>r.obs).length;
 return `<div class="chart">${s}</div><div class="lg2"><span><i style="background:${JC.ok}"></i>Meta cumplida ${cnt('ok')}</span><span><i style="background:${JC.cerca}"></i>Cerca ${cnt('cerca')}</span><span><i style="background:${JC.bajo}"></i>Bajo mínimo ${cnt('bajo')}</span><span><i style="background:${JC.sin}"></i>Sin operación ${cnt('sin')}</span><span><i style="background:#ffb547"></i>Con novedad ${nov}</span></div>`;
}

 return `<h3 class="sech">Registros</h3><div class="card rgs">${tabs}<div class="rmeta">${head}</div>${body||'<div class="empty">Sin registros en el periodo.</div>'}${add}</div>`;

/* Panel general */
function ringSvg(p,c1,c2,label){
 const r=36,C=2*Math.PI*r;const v=Math.max(0,Math.min(100,p));const id='g'+Math.random().toString(36).slice(2,7);
 return `<svg viewBox="0 0 92 92"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><circle cx="46" cy="46" r="${r}" fill="none" stroke="#ffffff14" stroke-width="7"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="url(#${id})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 46 46)"/><text x="46" y="50" text-anchor="middle" fill="#e9edff" style="font:700 16px 'Chakra Petch',sans-serif">${Math.round(v)}%</text></svg>`;
}
function monthSeries(n=6){
 const out=[];const d=new Date();d.setDate(1);
 for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const k=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');const f=k+'-01',t=k+'-31';
  const m=L('mov').filter(r=>r.fecha.startsWith(k)&&r.nat!=='anticipo');const rc=retroCalc(f,t);
  out.push({k,lab:MES[x.getMonth()],egr:sum(m)+rc.costoMina,ing:sum(L('cortes').filter(c=>c.fecha.startsWith(k)),c=>c.invCop)})}
 return out;
}
function monthChart(s){
 const W=640,H=220,pl=56,pb=26,pt=12;const mx=Math.max(1,...s.map(x=>Math.max(x.egr,x.ing)))*1.12;const bw=(W-pl-10)/s.length;
 const y=v=>pt+(H-pt-pb)*(1-v/mx);
 let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Egresos e ingresos por mes"><defs><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b6dff"/><stop offset="1" stop-color="#2ee6f0" stop-opacity=".35"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24d6a5" stop-opacity=".35"/><stop offset="1" stop-color="#24d6a5" stop-opacity="0"/></linearGradient></defs>`;
 for(let i=0;i<=4;i++){const v=mx/4*i;o+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#ffffff10"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmtK(v)}</text>`}
 s.forEach((x,i)=>{const cx=pl+i*bw+bw/2;o+=`<rect x="${cx-bw*.26}" y="${y(x.egr)}" width="${bw*.52}" height="${Math.max(0,y(0)-y(x.egr))}" rx="4" fill="url(#gm)"><title>${x.lab}: egresos ${fmt(x.egr)}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle">${x.lab}</text>`});
 const pts=s.map((x,i)=>[pl+i*bw+bw/2,y(x.ing)]);
 o+=`<path d="M${pts[0][0]},${y(0)} ${pts.map(p=>'L'+p[0]+','+p[1]).join(' ')} L${pts[pts.length-1][0]},${y(0)}Z" fill="url(#ga)"/><path d="${pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')}" fill="none" stroke="#24d6a5" stroke-width="2.5"/>`;
 pts.forEach((p,i)=>o+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}" fill="#0a0f2e" stroke="#24d6a5" stroke-width="2.5"><title>${s[i].lab}: ingresos ${fmt(s[i].ing)}</title></circle>`);
 return `<div class="chart">${o}</svg></div><div class="legend" style="margin-top:8px"><span><i style="background:#7b6dff"></i>Egresos (gastos, costos e inversiones)</span><span><i style="background:#24d6a5"></i>Ingresos por oro (inversionista)</span></div>`;
}
function alerts(){
 const a=[];const t=today(),lim=addDays(t,30);
 L('obl').filter(o=>!o.done&&assetOf(o)&&!assetOf(o).del).sort((x,z)=>x.fecha.localeCompare(z.fecha)).forEach(o=>{const n=ASSET[o.ac].name(assetOf(o));if(o.fecha<t)a.push(['ba',`${n}: ${oblName(o)} vencido desde ${fd(o.fecha)}.`]);else if(o.fecha<=lim)a.push(['',`${n}: ${oblName(o)} vence el ${fd(o.fecha)}.`])});
 L('veh').forEach(v=>['SOAT','Revisión técnico-mecánica'].forEach(tp=>{const o=L('obl').find(o=>o.aid===v.id&&o.tipo===tp&&!o.done);if(!o||o.est)a.push(['',`${v.placa}: ${o?'confirma':'registra'} la fecha de ${tp==='SOAT'?'vencimiento del SOAT':'la revisión técnico-mecánica'} en la ficha del vehículo.`])}));
 const {f}=retroPeriodo();const R=retroCalc(f,'');if(R.bajo)a.push(['',`Retroexcavadora: ${R.bajo} días por debajo de ${S.retroP.min} horas en el periodo actual.`]);
 const ant=sum(L('per').filter(p=>p.sc==='mina'),p=>anticiposPend(p.id));if(ant)a.push(['',`Mina: ${fmt(ant)} en anticipos por descontar en el próximo corte.`]);
 const pend=minaPendiente();if(pend)a.push(['ba',`Mina: ${fmt(pend)} en costos aún sin cubrir con cortes de oro.`]);
 L('inm').forEach(i=>{const ej=sum(L('mov').filter(r=>r.p==='inm'&&r.inm===i.id));if(i.pres&&ej>i.pres*.9)a.push([ej>i.pres?'ba':'',`${i.nombre}: ejecutado ${(ej/i.pres*100).toFixed(0)}% del presupuesto.`])});
 if(S.outbox.length)a.push(['',`${S.outbox.length} cambios guardados en este equipo esperan sincronizar con Drive.`]);
 return a;
}

 const prs=L('prest').filter(p=>saldoPrest(p)>0);

function moneyMask(el){const d=el.value.replace(/\D/g,'');el.value=d?(+d).toLocaleString('es-CO'):''}
function readForm(){const o={};FORM.fields.forEach(f=>{const el=$('#f_'+f.k);if(!el)return;
 if(f.t==='money')o[f.k]=+(el.value.replace(/\D/g,''))||0;else if(f.t==='dec')o[f.k]=num(el.value);else if(f.t==='checks')o[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);else if(f.t==='photo'||f.t==='html')o[f.k]=FORM.rec?.[f.k];else o[f.k]=el.value.trim()});return o}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';$('#sheet').classList.remove('wide');FORM=null;FICHA=null}
async function compress(file){
 const rd=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
 if(!file.type.startsWith('image/'))return rd(file);
 const url=URL.createObjectURL(file);
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
 const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.72);
}

const COLLS=['mov','prest','abonos','cab','veh','inm','per','cortes','rh','rs','rc','rcort','cats','eq','obl'];
function migrate(){
 COLLS.forEach(c=>{if(!Array.isArray(S[c]))S[c]=[]});if(!Array.isArray(S.outbox))S.outbox=[];
 S.cfg=Object.assign({role:'admin',pin:'',url:'',token:'',device:uid(),sheetUrl:'https://docs.google.com/spreadsheets/d/1ggJdlmDgeIXk0o0W41a9pRzUtoiHNmZOvs5IT0KSpTk/edit',pct:{ter:20,emp:8,com:2,adm:3},presMina:0},S.cfg||{});
 S.retroP=Object.assign({maq:'Retroexcavadora',dueno:'',precio:0,min:7,alerta:80,pctComb:0},S.retroP||{});
 if((S.v||1)<2){
  L('veh').forEach(v=>[['soat','SOAT'],['tr','Seguro todo riesgo'],['tecno','Revisión técnico-mecánica']].forEach(([k,tp])=>{if(v[k]&&!L('obl').some(o=>o.aid===v.id&&o.tipo===tp))upsert('obl',{ac:'veh',aid:v.id,tipo:tp,fecha:v[k],meses:12,nota:'',hist:[],done:false})}));
  L('mov').filter(r=>r.p==='mina'&&r.s==='activos'&&!r.eq).forEach(r=>{const e=upsert('eq',{nombre:r.concepto,tipo:r.cat,marca:'',serie:'',fcompra:r.fecha,valor:r.valor,prov:r.tercero||''});r.eq=e.id;queue('mov',r.id)});
  S.v=2;save();
 }
 if(S.v<3){
  const REF={prest:[['abonos','prest']],per:[['mov','per']],veh:[['mov','veh'],['obl','aid']],cab:[['mov','cab'],['obl','aid']],inm:[['mov','inm'],['obl','aid']],eq:[['mov','eq'],['obl','aid']]};
  COLLS.forEach(c=>{const miss=S[c].filter(r=>!r.id||r.id==='undefined');if(!miss.length)return;miss.forEach(r=>{r.id=uid();queue(c,r.id)});
   if(miss.length===1&&REF[c])REF[c].forEach(([rc,f])=>S[rc].forEach(x=>{if(f in x&&(x[f]==null||x[f]==='undefined')&&(rc!=='obl'||x.ac===c)){x[f]=miss[0].id;if(x.id)queue(rc,x.id)}}))});
  S.outbox=S.outbox.filter(o=>o.id&&o.id!=='undefined');
  S.v=3;save();
 }
}
async function api(op,payload={}){
 const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),op==='file'?90000:60000);
 try{const r=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({op,token:S.cfg.token,device:S.cfg.device},payload)),signal:ctl.signal});
  let j;try{j=await r.json()}catch(e){throw new Error('El servicio no respondió bien. Revisa que la implementación tenga acceso para “Cualquier usuario”.')}
  if(!j.ok)throw new Error(j.error||'Error del servidor');return j}
 catch(e){if(e.name==='AbortError')throw new Error('El servicio tardó demasiado en responder');if(e instanceof TypeError)throw new Error('No se pudo conectar con el servicio. Revisa el enlace y la señal.');throw e}
 finally{clearTimeout(to)}
}

 if(!COLLS.includes(x.c)||!x.rec||!x.rec.id)return;
 const okId=v=>v==null||v===''||/^[\w.:-]{1,80}$/.test(String(v));
 if(!okId(x.rec.id)||!['foto','fotoDrive','foto2','fotoDrive2','per','veh','cab','eq','inm','prest','aid'].every(k=>okId(x.rec[k])))return;

 if((x.rec.upd||0)>(cur.upd||0)){if(S.outbox.some(o=>o.c===x.c&&o.id===cur.id)&&(cur.upd||0)>(x.rec.upd||0))return;Object.keys(cur).forEach(k=>delete cur[k]);Object.assign(cur,x.rec);S.outbox=S.outbox.filter(o=>!(o.c===x.c&&o.id===cur.id))}

}
let SYNCING=false,SYNC_T=0;
function scheduleSync(ms=15000){clearTimeout(SYNC_T);if(S.cfg.url&&S.cfg.token)SYNC_T=setTimeout(()=>sync(false),ms)}
async function sync(manual){
 if(SYNCING)return;
 if(!S.cfg.url||!S.cfg.token){if(manual){toast('Falta conectar el servicio de Drive en Ajustes');go('ajustes')}return}
 if(!navigator.onLine){if(manual)toast('Sin señal. Los cambios quedan guardados en este equipo.');return}
 SYNCING=true;renderStatus();let got=0,sent=0;
 try{
  if(S.cfg.scopeUrl!==S.cfg.url||!S.cfg.tokRole)applyScope(await api('ping'));
  for(let pass=0;pass<3;pass++){
   const full=canPush()&&S.cfg.pushedAll!==S.cfg.url;
   const items=full?allItems():(canPush()?S.outbox.slice():[]);
   const changes=items.map(toChange).filter(Boolean);
   const j=await api('sync',{since:S.cfg.pushedAll===S.cfg.url||!canPush()?(S.lastSync||0):0,changes});
   applyScope(j);
   S.outbox=canPush()?S.outbox.filter(o=>!items.some(s=>s.c===o.c&&s.id===o.id&&s.t>=o.t)):[];
   (j.changes||[]).forEach(mergeIn);got+=(j.changes||[]).length;sent+=j.accepted||0;
   if(full)S.cfg.pushedAll=S.cfg.url;
   S.lastSync=j.serverTime||Date.now();S.cfg.syncErr='';save();
   const up=await uploadPhotos();
   if(!up&&!S.outbox.length)break;
  }
  const since=Date.now()-(S.cfg.lastReport||0);
  if(canPush()&&(((got||sent)&&since>600000)||since>3600e3||(manual&&(got||sent)))){try{await api('report',{data:buildReport()});S.cfg.lastReport=Date.now()}catch(e){}}
  save();if(manual)toast(got||sent?`Sincronizado: ${sent} enviados, ${got} recibidos`:'Todo al día con Drive');
 }catch(e){S.cfg.syncErr=e.message||'Error';save();if(manual)toast(S.cfg.syncErr)}
 SYNCING=false;render();
}
setInterval(()=>{if(S&&document.visibilityState==='visible'&&navigator.onLine&&S.cfg.url&&S.cfg.token)sync(false)},600000);
document.addEventListener('visibilitychange',()=>{if(!S)return;if(document.hidden){clearTimeout(saveT);DB.put('kv','state',S)}else if(navigator.onLine&&S.cfg.url&&S.cfg.token&&Date.now()-(S.lastSync||0)>120000)sync(false)});
window.addEventListener('pagehide',()=>{if(S){clearTimeout(saveT);DB.put('kv','state',S)}});

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act==='close'||b.closest('#modal')||b.closest('.nav')||b.closest('.view')||b.closest('.top')||b.id==='fab'){e.preventDefault();ACT[b.dataset.act]?.(b.dataset)}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('change',e=>{
 const k=e.target.dataset.actChange;
 if(k==='rf'||k==='rt'){if(e.target.value){V.f[k]=e.target.value;V.f.custom=1;render()}}
 if(k==='role'){const nv=e.target.value;const need=S.cfg.pin&&((nv==='admin'&&S.cfg.role!=='admin')||(nv==='aux'&&!['admin','aux'].includes(S.cfg.role)));
  const apply=()=>{S.cfg.role=nv;save();if(nv==='dueno')go('retro','dueno');else render();toast('Perfil: '+ROLES[nv])};
  if(need){e.target.value=S.cfg.role;openForm({title:'Ingresa el PIN',fields:[{k:'pin',l:'PIN',t:'password',req:1}],save:v=>{if(v.pin!==S.cfg.pin){toast('PIN incorrecto');return false}apply();return 'Acceso concedido'}})}else apply()}
 if(e.target.id==='heroPh'&&e.target.files[0]){const {c,id}=e.target.dataset;const fl=e.target.files[0];compress(fl).then(async data=>{const fid=uid();const rec={name:fl.name,data};await DB.put('files',fid,rec);IMG[fid]=rec;upsert(c,{id,foto:fid,fotoDrive:'',fotoUrl:''});render();openFicha(c,id);toast('Foto actualizada')}).catch(()=>toast('No se pudo leer la foto'))}
 if(e.target.id==='restore'&&e.target.files[0]){const fr=new FileReader();fr.onload=async()=>{try{const d=JSON.parse(fr.result);if(!d.mov)throw 0;S=d;migrate();await DB.put('kv','state',S);render();toast('Respaldo restaurado')}catch(_){toast('El archivo no es un respaldo válido')}};fr.readAsText(e.target.files[0])}
});
document.addEventListener('input',e=>{if(e.target.matches('.view [data-money]'))moneyMask(e.target)});
$('#ham').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('open')};
$('#scrim').onclick=closeSide;
window.addEventListener('online',()=>{renderStatus();sync(false)});
window.addEventListener('offline',renderStatus);

/* ---------- app instalable (PWA) ---------- */
let INSTALL=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;if(V.m==='ajustes')render()});
window.addEventListener('appinstalled',()=>{INSTALL=null;toast('App instalada')});
if('serviceWorker' in navigator&&document.querySelector('link[rel=manifest]')&&(location.protocol==='https:'||location.hostname==='localhost')){
 navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Nueva versión lista. Cierra y abre la app para usarla.')})})}).catch(()=>{});
 try{navigator.storage?.persist?.()}catch(e){}
}

/* ---------- arranque ---------- */
(async()=>{
 await DB.open();
 let st=null;try{st=await DB.get('kv','state')}catch(e){}
 S=st&&st.mov?st:seed();
 migrate();
 if(!DB.db)setTimeout(()=>toast('Este navegador no permite guardar datos: lo que registres se perderá al cerrar. Usa la app instalada o un navegador normal.'),1200);
 if(!st)DB.put('kv','state',S);
 const h=(location.hash||'').slice(1).split('.');
 if(h[0]&&modOf(h[0]))go(h[0],h[1]);else render();
 if(navigator.onLine&&S.cfg.url&&S.cfg.token)setTimeout(()=>sync(false),1500);
 dlNs();
})();
</script>
