<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tablero Financiero</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tablero">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a0f2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar de módulos desplegables + panel de trabajo; en móvil el menú es un cajón y hay botón flotante de registro */
:root{
  --bg:#0a0f2e; --bg2:#0e1540; --panel:#131b4d; --panel2:#19235e; --line:#28357a; --line2:#34439a;
  --fg:#e9edff; --mut:#93a0d6; --dim:#6773ad;
  --cyan:#2ee6f0; --teal:#24d6a5; --violet:#7b6dff; --gold:#f2c75c; --warn:#ffad4d; --bad:#ff5c7c; --ok:#24d6a5;
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#1d2577 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#13205e 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:linear-gradient(180deg,#121a4f 0%,#0d1440 100%);border-right:1px solid var(--line);padding:18px 12px 24px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 10px}
.brand .mk{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--cyan);display:grid;place-items:center;box-shadow:0 0 18px #2ee6f055 inset,0 0 12px #2ee6f033}
.brand b{font:700 15px/1.1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;display:block}
.brand small{color:var(--mut);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:10px 10px;border:0;background:transparent;border-radius:10px;text-align:left;color:var(--fg);font:600 12.5px/1.2 var(--f-disp);letter-spacing:.07em;text-transform:uppercase}
.nv svg{flex:none;width:19px;height:19px;stroke:var(--mut)}
.nv .chev{margin-left:auto;width:15px;height:15px;transition:transform .2s}
.nv[aria-expanded="true"] .chev{transform:rotate(90deg)}
.nv:hover{background:#ffffff0a}
.nv.on{background:linear-gradient(90deg,#2ee6f022,#2ee6f005);box-shadow:inset 2px 0 0 var(--cyan)}
.nv.on svg{stroke:var(--cyan)}
.subs{display:flex;flex-direction:column;gap:1px;padding:2px 0 8px 40px}
.subs[hidden]{display:none!important}
.sb{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;color:var(--mut);font-size:13.5px;font-weight:500}
.sb:hover{color:var(--fg);background:#ffffff08}
.sb.on{color:var(--cyan);background:#2ee6f012}
.side-foot{margin-top:auto;border:1px solid var(--line2);border-radius:var(--r);padding:14px;background:linear-gradient(160deg,#1d2a78,#141c55);display:grid;gap:8px}
.side-foot .lbl{font:600 10.5px var(--f-disp);letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.side-foot .big{font:700 22px var(--f-disp);font-variant-numeric:tabular-nums}
/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));background:#0a0f2ee6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ham{display:none;border:1px solid var(--line2);background:var(--panel);border-radius:10px;width:40px;height:40px;place-items:center}
.ham svg{width:20px;height:20px;stroke:var(--fg)}
.crumb{min-width:0}
.crumb small{display:block;color:var(--mut);font:600 10.5px var(--f-disp);letter-spacing:.14em;text-transform:uppercase}
.crumb h1{margin:0;font:700 19px/1.2 var(--f-disp);letter-spacing:.03em;text-wrap:balance;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.off .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.pill.sync .dot{background:var(--cyan);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.view{padding:22px max(18px,env(safe-area-inset-right,0px)) 110px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}
/* Cards & KPIs */
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.k3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font:600 12px var(--f-disp);letter-spacing:.13em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font:500 12px var(--f-body)}
.kpi{position:relative;overflow:hidden}
.kpi .l{font:600 11px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font:700 25px/1.15 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:.01em;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:4px}
.kpi::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:linear-gradient(90deg,var(--c,var(--cyan)),transparent);opacity:.85}
.c-cy{--c:var(--cyan)}.c-te{--c:var(--teal)}.c-vi{--c:var(--violet)}.c-go{--c:var(--gold)}.c-ba{--c:var(--bad)}.c-wa{--c:var(--warn)}
.pos{color:var(--teal)}.neg{color:var(--bad)}.gold{color:var(--gold)}.mut{color:var(--mut)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px}
/* Toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke:currentColor}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:linear-gradient(90deg,#16b9c8,#5c62ff);border-color:transparent;color:#fff;box-shadow:0 4px 18px #2ee6f033}
.btn.gh{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.dan{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--mut)}
.chip.on{color:#05202a;background:var(--cyan);border-color:var(--cyan)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:#ffffff10;color:var(--mut);white-space:nowrap}
.tag.gasto{background:#ff5c7c1f;color:#ff8ea4}.tag.costo{background:#ffad4d1f;color:#ffc27e}.tag.inversion{background:#7b6dff26;color:#b0a8ff}.tag.ingreso{background:#24d6a51f;color:#5fe8c2}.tag.anticipo{background:#2ee6f01a;color:#7cf0f6}
.tag.ok{background:#24d6a51f;color:#5fe8c2}.tag.wa{background:#ffad4d1f;color:#ffc27e}.tag.ba{background:#ff5c7c1f;color:#ff8ea4}
.search{flex:1;min-width:160px;max-width:320px;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:9px 12px}
/* Tables */
.tw{overflow-x:auto;border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font:600 10.5px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid #ffffff0d;vertical-align:top}
.t tr.rw:hover td{background:#ffffff06}
.t td.n,.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t tfoot td{font-weight:700;border-top:1px solid var(--line2);border-bottom:0}
.t .acts{white-space:nowrap;text-align:right}
.ib{border:0;background:transparent;padding:5px;border-radius:7px;color:var(--mut)}
.ib svg{width:17px;height:17px;stroke:currentColor;display:block}
.ib:hover{color:var(--cyan);background:#ffffff0c}
.ib.dan:hover{color:var(--bad)}
.empty{padding:28px 12px;text-align:center;color:var(--mut)}
/* Person / entity cards */
.ent{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ec{background:linear-gradient(165deg,#1b2564,#141c52);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.ec .hd{display:flex;align-items:flex-start;gap:10px}
.ec .hd b{font-weight:700;font-size:14.5px;line-height:1.25}
.ec .hd small{display:block;color:var(--mut);font-size:12px}
.ec .hd .tag{margin-left:auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
.kv span:nth-child(even){font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.ec .bar{gap:6px}
.meter{height:6px;border-radius:9px;background:#ffffff12;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--cyan))}
/* Rings */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.ring{display:grid;justify-items:center;gap:6px;text-align:center}
.ring svg{width:92px;height:92px}
.ring b{font-size:12.5px;font-weight:600}
.ring small{color:var(--mut);font-size:11.5px;font-family:var(--f-mono)}
/* Alerts */
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #ffffff0d;font-size:13.5px}
.al:last-child{border-bottom:0}
.al i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.al.ba i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.al.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font:11px var(--f-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* Modal */
.modal{position:fixed;inset:0;z-index:80;background:#04071acc;backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.sheet{width:min(620px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:linear-gradient(170deg,#1b2566,#121a4c);border:1px solid var(--line2);border-radius:18px;box-shadow:0 20px 60px #0008,0 0 0 1px #2ee6f011}
.sheet .sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:16px 18px;background:#1a2463f2;border-bottom:1px solid var(--line)}
.sheet .sh h2{margin:0;font:700 16px var(--f-disp);letter-spacing:.04em}
.sheet .sh .ib{margin-left:auto}
.sheet .sbd{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.sheet .sft{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:#141c52f2;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld.w{grid-column:1/-1}
.fld label{font:600 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:11px 12px;font-size:16px}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--cyan);outline:0;box-shadow:0 0 0 3px #2ee6f022}
.fld .hint{font-size:12px;color:var(--dim)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font:500 13.5px var(--f-body);letter-spacing:0;text-transform:none;color:var(--fg)}
.checks input{width:auto;accent-color:var(--cyan)}
.prev{border:1px dashed var(--line2);border-radius:12px;padding:12px;background:#0a0f2e80}
.photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line2)}
.viewer img{width:100%;border-radius:10px}
/* Quick FAB */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#19c9d6,#6a5cff);box-shadow:0 8px 28px #2ee6f055;display:none;place-items:center}
.fab svg{width:26px;height:26px;stroke:#fff}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.qgrid h4{grid-column:1/-1;margin:8px 0 0;font:600 11px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#1d2a78;border:1px solid var(--cyan);color:var(--fg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px #0008;max-width:calc(100% - 32px)}
.scrim{display:none}
.note{font-size:13px;color:var(--mut);border-left:2px solid var(--violet);padding:4px 0 4px 12px}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hstat{display:flex;gap:18px;flex-wrap:wrap}
.hstat div{display:grid}
.hstat small{color:var(--mut);font:600 10.5px var(--f-disp);letter-spacing:.1em;text-transform:uppercase}
.hstat b{font:700 18px var(--f-disp);font-variant-numeric:tabular-nums}
.ro .edit-only{display:none!important}
.nodel .del-only{display:none!important}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:70;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-105%);transition:transform .25s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:20px 0 60px #000a}
  .scrim.open{display:block;position:fixed;inset:0;z-index:65;background:#0008}
  .ham{display:grid}
  .fab{display:grid}
  .ro .fab{display:none}
  .top .pill.role{display:none}
}
@media (max-width:640px){
  .fg{grid-template-columns:minmax(0,1fr)}
  .kpi .v{font-size:21px}
  .view{gap:14px;padding-top:16px}
  .sheet{border-radius:18px 18px 0 0;max-height:94dvh}
  .modal{place-items:end center;padding:0}
  table.t.cards thead{display:none}
  table.t.cards tr.rw{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid #ffffff12}
  table.t.cards td{display:block;padding:0;border:0}
  table.t.cards td[data-l]::before{content:attr(data-l) " · ";color:var(--dim);font-size:11.5px}
  table.t.cards td.p{grid-column:1/-1;font-weight:600}
  table.t.cards td.n{grid-column:2;grid-row:1;font-size:14px}
  table.t.cards td.acts{grid-column:1/-1;text-align:left}
  table.t.cards tfoot tr{display:flex;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="Menú principal">
    <div class="brand">
      <div class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2ee6f0" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
      <div><b>Tablero Financiero</b><small>Finanzas y proyectos</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="ham" id="ham" aria-label="Abrir menú"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumb"><small id="crumbS">Panel</small><h1 id="crumbH">Panel general</h1></div>
      <div class="sp"></div>
      <button class="pill" id="syncPill" data-act="sync" title="Sincronizar con Drive"><span class="dot"></span><span id="syncTxt">En línea</span></button>
      <span class="pill role" id="rolePill"></span>
    </header>
    <section class="view" id="view"></section>
  </div>
</div>
<button class="fab" id="fab" data-act="quick" aria-label="Registrar movimiento"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const fmt=n=>(n<0?'-$':'$')+Math.round(Math.abs(n||0)).toLocaleString('es-CO');
const fmtK=n=>{const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?'$'+(a/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+'M':a>=1e3?'$'+Math.round(a/1e3)+'k':'$'+Math.round(a))};
const fg=n=>(+n||0).toLocaleString('es-CO',{maximumFractionDigits:2});

const MEM={};
const DB={db:null,
 async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('tablero-fin',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('files')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
 get(st,k){if(!this.db)return Promise.resolve(MEM[st+k]);return new Promise(res=>{try{const q=this.db.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(MEM[st+k])}catch(e){res(MEM[st+k])}})},
 put(st,k,v){MEM[st+k]=v;if(!this.db)return;try{this.db.transaction(st,'readwrite').objectStore(st).put(v,k)}catch(e){}}
};

 const now=Date.now();let r=data.id&&byId(c,data.id);

/* ---------- cálculos ---------- */
function retroCalc(f,t){
 const P=S.retroP;const h=L('rh').filter(r=>inP(r.fecha,f,t));
 const horas=sum(h,r=>r.horas);const dias=h.filter(r=>r.horas>0).length;const bajo=h.filter(r=>r.horas>0&&r.horas<P.min).length;
 const renta=horas*P.precio;const sal=L('rs').filter(r=>inP(r.fecha,f,t));
 const repD=sum(sal.filter(r=>r.asume!=='Mina'));const salM=sum(sal.filter(r=>r.asume==='Mina'));
 const comb=sum(L('rc').filter(r=>inP(r.fecha,f,t)));const combD=comb*(P.pctComb||0)/100;
 const neto=renta-repD-combD;const cargoMina=comb-combD+salM;
 return {h,horas,dias,prom:dias?horas/dias:0,bajo,renta,repD,salM,comb,combD,neto,cargoMina,costoMina:renta+cargoMina};
}
const lastRetroCorte=()=>L('rcort').map(r=>r.fecha).sort().pop()||'';
function anticiposPend(perId,exclCorte){
 const ant=sum(L('mov').filter(r=>r.p==='mina'&&r.s==='nomina'&&r.per===perId&&r.nat==='anticipo'));
 const desc=sum(L('cortes').filter(c=>c.id!==exclCorte).flatMap(c=>c.liq||[]).filter(x=>x.per===perId),x=>x.desc);
 return Math.max(0,ant-desc);
}
function minaCostos(f,t){return sum(L('mov').filter(r=>r.p==='mina'&&r.nat==='costo'&&inP(r.fecha,f,t)))+retroCalc(f,t).costoMina}
function minaPendiente(exclCorte){return Math.max(0,minaCostos()-sum(L('cortes').filter(c=>c.id!==exclCorte),c=>c.abono))}
function reparto(total,g,partIds,exclCorte){
 const pc=S.cfg.pct;const inv=100-pc.ter-pc.emp-pc.com-pc.adm;
 const per=L('per').filter(p=>p.sc==='mina'&&!p.inactivo);
 const one=r=>per.find(p=>p.rol===r);
 const lines=[];
 const push=(key,label,pct,p)=>{const cop=total*pct/100,gr=g*pct/100;const d=p?Math.min(cop,anticiposPend(p.id,exclCorte)):0;lines.push({key,label,pct,per:p?.id||'',nombre:p?.nombre||'',g:gr,cop,desc:d,neto:cop-d})};
 push('ter','Dueño del terreno',pc.ter,one('Dueño del terreno'));
 const emps=per.filter(p=>p.rol==='Empleado directo'&&partIds.includes(p.id));
 if(emps.length)emps.forEach(p=>push('emp','Empleado directo',pc.emp/emps.length,p));else push('emp','Empleados directos (sin asignar)',pc.emp,null);
 push('com','Comisionista',pc.com,one('Comisionista'));
 push('adm','Administrador',pc.adm,one('Administrador'));
 lines.push({key:'inv',label:'Dueño de la mina (inversionista)',pct:inv,per:'',nombre:'',g:g*inv/100,cop:total*inv/100,desc:0,neto:total*inv/100});
 return lines;
}
function report(f,t){
 const M=L('mov').filter(r=>inP(r.fecha,f,t));
 const agg=a=>({gas:sum(a.filter(r=>r.nat==='gasto')),cos:sum(a.filter(r=>r.nat==='costo')),inv:sum(a.filter(r=>r.nat==='inversion')),ant:sum(a.filter(r=>r.nat==='anticipo'))});
 const subs=(a,p)=>{const o={};a.filter(r=>r.nat!=='anticipo').forEach(r=>{const k=subOf(p,r.s)?.name||r.s;o[k]=(o[k]||0)+r.valor});return o};
 const rows=[];
 const mk=(id,name,a,p)=>{const x=Object.assign({id,name,ing:0,subs:subs(a,p),n:a.length},agg(a));rows.push(x);return x};
 mk('personal','Gastos personales',M.filter(r=>r.p==='personal'),'personal');
 mk('parcela','Parcela Las Colinas',M.filter(r=>r.p==='parcela'),'parcela');
 L('inm').forEach(i=>{const x=mk('inm:'+i.id,i.nombre,M.filter(r=>r.p==='inm'&&r.inm===i.id),'inm');x.pres=i.pres});
 const mn=mk('mina','Mina La Fe',M.filter(r=>r.p==='mina'),'mina');
 const rc=retroCalc(f,t);mn.cos+=rc.costoMina;mn.subs['Retroexcavadora (renta y combustible)']=rc.costoMina;mn.retro=rc;
 const cs=L('cortes').filter(c=>inP(c.fecha,f,t));mn.ing=sum(cs,c=>c.invCop);mn.oroG=sum(cs,c=>c.gramos);mn.bruto=sum(cs,c=>c.total);mn.cortes=cs.length;
 rows.forEach(r=>{r.util=r.ing-r.gas-r.cos;r.egr=r.gas+r.cos+r.inv});
 mn.rent=(mn.cos+mn.inv)?mn.util/(mn.cos+mn.inv)*100:0;
 const T={ing:sum(rows,r=>r.ing),gas:sum(rows,r=>r.gas),cos:sum(rows,r=>r.cos),inv:sum(rows,r=>r.inv)};T.util=T.ing-T.gas-T.cos;T.egr=T.gas+T.cos+T.inv;
 const pr={col:sum(L('prest').filter(r=>inP(r.fecha,f,t))),rec:sum(L('abonos').filter(r=>inP(r.fecha,f,t))),saldo:sum(L('prest'))-sum(L('abonos'))};
 return {rows,T,pr,M};
}

function hoursChart(h){
 const P=S.retroP;const d=h.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(-20);
 if(!d.length)return '<div class="empty">Sin horas registradas.</div>';
 const W=640,H=210,pl=30,pb=26,pt=10;const mx=Math.max(P.min+2,...d.map(r=>r.horas));const bw=(W-pl-8)/d.length;
 const y=v=>pt+(H-pt-pb)*(1-v/mx);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas por día"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ee6f0"/><stop offset="1" stop-color="#5c62ff" stop-opacity=".55"/></linearGradient></defs>`;
 for(let i=0;i<=mx;i+=Math.ceil(mx/4)){s+=`<line x1="${pl}" x2="${W-4}" y1="${y(i)}" y2="${y(i)}" stroke="#ffffff12"/><text x="${pl-6}" y="${y(i)+4}" text-anchor="end">${i}</text>`}
 d.forEach((r,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;const lo=r.horas>0&&r.horas<P.min;s+=`<rect x="${x}" y="${y(r.horas)}" width="${w}" height="${Math.max(0,y(0)-y(r.horas))}" rx="3" fill="${lo?'#ffad4d':'url(#gb)'}"><title>${fd(r.fecha)}: ${r.horas} h</title></rect>`;
  if(d.length<=16||i%2===0)s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${r.fecha.slice(8)}/${r.fecha.slice(5,7)}</text>`});
 s+=`<line x1="${pl}" x2="${W-4}" y1="${y(P.min)}" y2="${y(P.min)}" stroke="#ff5c7c" stroke-dasharray="5 4"/><text x="${W-6}" y="${y(P.min)-5}" text-anchor="end" style="fill:#ff8ea4">mínimo ${P.min} h</text></svg>`;
 return `<div class="chart">${s}</div><div class="legend" style="margin-top:8px"><span><i style="background:#2ee6f0"></i>Horas del día</span><span><i style="background:#ffad4d"></i>Bajo el mínimo</span></div>`;
}

/* Préstamos */
function vPrest(){
 const ps=L('prest');const q=V.q.toLowerCase();
 const pf=V.f.prest||'act';
 let list=ps.map(p=>({...p,ab:sum(L('abonos').filter(a=>a.prest===p.id)),sal:saldoPrest(p)}));
 if(pf==='act')list=list.filter(p=>p.sal>0);if(pf==='pag')list=list.filter(p=>p.sal<=0);
 if(q)list=list.filter(p=>[p.nombre,p.cedula,p.nota].join(' ').toLowerCase().includes(q));
 list.sort((a,b)=>b.fecha.localeCompare(a.fecha));
 const people={};ps.forEach(p=>{const k=(p.cedula||p.nombre.toLowerCase());(people[k]=people[k]||{nombre:p.nombre,cedula:p.cedula,v:0,s:0,n:0});people[k].v+=p.valor;people[k].s+=saldoPrest(p);people[k].n++});
 const tot=sum(ps),ab=sum(L('abonos'));
 return `<div class="grid k4">${kpi('Saldo por cobrar',fmt(tot-ab),`${ps.filter(p=>saldoPrest(p)>0).length} préstamos activos`,'c-go','gold')}${kpi('Total prestado',fmt(tot),`${ps.length} préstamos`,'c-vi')}${kpi('Recuperado',fmt(ab),tot?(ab/tot*100).toFixed(1)+'% del capital':'','c-te')}${kpi('Deudores',Object.values(people).filter(x=>x.s>0).length,'Con saldo pendiente','c-cy')}</div>
 <div class="card"><div class="bar"><button class="btn pri edit-only" data-act="newPrest">${ic('plus')}Prestar</button><button class="btn edit-only" data-act="newAbono">${ic('cash')}Recibir pago o abono</button><input class="search" id="q" placeholder="Buscar nombre o cédula" aria-label="Buscar"></div>
 <div class="chips" style="margin:12px 0">${[['act','Con saldo'],['pag','Pagados'],['all','Todos']].map(([k,l])=>`<button class="chip ${pf===k?'on':''}" data-act="fcat" data-k="prest" data-v="${k}">${l}</button>`).join('')}</div>
 ${list.length?`<div class="tw"><table class="t cards"><thead><tr><th>Fecha</th><th>Nombre</th><th>Cédula</th><th class="n">Préstamo</th><th class="n">Abonos</th><th class="n">Saldo</th><th></th></tr></thead><tbody>
 ${list.map(p=>`<tr class="rw"><td class="num" data-l="Fecha">${fd(p.fecha)}</td><td class="p">${esc(p.nombre)}${p.nota?`<div class="mut" style="font-size:12px;font-weight:400">${esc(p.nota)}${p.interes?' · interés '+p.interes+'%':''}</div>`:''}</td><td data-l="CC" class="num">${esc(p.cedula||'—')}</td><td data-l="Préstamo" class="n">${fmt(p.valor)}</td><td data-l="Abonos" class="n">${fmt(p.ab)}</td><td class="n ${p.sal>0?'gold':'pos'}">${p.sal>0?fmt(p.sal):'Pagado'}</td>${rowActs('prest',p.id,`<button class="ib edit-only" data-act="newAbono" data-id="${p.id}" title="Recibir abono">${ic('cash')}</button><button class="ib" data-act="estado" data-id="${p.id}" title="Estado de cuenta">${ic('eye')}</button>`)}</tr>`).join('')}
 </tbody><tfoot><tr><td colspan="3">${list.length} préstamos</td><td class="n">${fmt(sum(list))}</td><td class="n">${fmt(sum(list,p=>p.ab))}</td><td class="n">${fmt(sum(list,p=>p.sal))}</td><td></td></tr></tfoot></table></div>`:'<div class="empty">No hay préstamos en este filtro.</div>'}</div>
 <div class="card"><h3>Saldo por persona</h3><div class="ent">${Object.values(people).sort((a,b)=>b.s-a.s).map(x=>`<div class="ec"><div class="hd"><div><b>${esc(x.nombre)}</b><small>${x.cedula?'CC '+esc(x.cedula):'Sin cédula registrada'}</small></div><span class="tag">${x.n}</span></div><div class="kv"><span>Prestado</span><span>${fmt(x.v)}</span><span>Saldo</span><span class="${x.s>0?'gold':'pos'}">${fmt(x.s)}</span></div><div class="meter"><i style="width:${x.v?Math.min(100,(x.v-x.s)/x.v*100):0}%"></i></div></div>`).join('')}</div></div>`;
}

/* Panel general */
function ringSvg(p,c1,c2,label){
 const r=36,C=2*Math.PI*r;const v=Math.max(0,Math.min(100,p));const id='g'+Math.random().toString(36).slice(2,7);
 return `<svg viewBox="0 0 92 92"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><circle cx="46" cy="46" r="${r}" fill="none" stroke="#ffffff14" stroke-width="7"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="url(#${id})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 46 46)"/><text x="46" y="50" text-anchor="middle" fill="#e9edff" style="font:700 16px 'Chakra Petch',sans-serif">${Math.round(v)}%</text></svg>`;
}
function monthSeries(n=6){
 const out=[];const d=new Date();d.setDate(1);
 for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const k=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');const f=k+'-01',t=k+'-31';
  const m=L('mov').filter(r=>r.fecha.startsWith(k)&&r.nat!=='anticipo');const rc=retroCalc(f,t);
  out.push({k,lab:MES[x.getMonth()],egr:sum(m)+rc.costoMina,ing:sum(L('cortes').filter(c=>c.fecha.startsWith(k)),c=>c.invCop)})}
 return out;
}
function monthChart(s){
 const W=640,H=220,pl=56,pb=26,pt=12;const mx=Math.max(1,...s.map(x=>Math.max(x.egr,x.ing)))*1.12;const bw=(W-pl-10)/s.length;
 const y=v=>pt+(H-pt-pb)*(1-v/mx);
 let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Egresos e ingresos por mes"><defs><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b6dff"/><stop offset="1" stop-color="#2ee6f0" stop-opacity=".35"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24d6a5" stop-opacity=".35"/><stop offset="1" stop-color="#24d6a5" stop-opacity="0"/></linearGradient></defs>`;
 for(let i=0;i<=4;i++){const v=mx/4*i;o+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#ffffff10"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmtK(v)}</text>`}
 s.forEach((x,i)=>{const cx=pl+i*bw+bw/2;o+=`<rect x="${cx-bw*.26}" y="${y(x.egr)}" width="${bw*.52}" height="${Math.max(0,y(0)-y(x.egr))}" rx="4" fill="url(#gm)"><title>${x.lab}: egresos ${fmt(x.egr)}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle">${x.lab}</text>`});
 const pts=s.map((x,i)=>[pl+i*bw+bw/2,y(x.ing)]);
 o+=`<path d="M${pts[0][0]},${y(0)} ${pts.map(p=>'L'+p[0]+','+p[1]).join(' ')} L${pts[pts.length-1][0]},${y(0)}Z" fill="url(#ga)"/><path d="${pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')}" fill="none" stroke="#24d6a5" stroke-width="2.5"/>`;
 pts.forEach((p,i)=>o+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}" fill="#0a0f2e" stroke="#24d6a5" stroke-width="2.5"><title>${s[i].lab}: ingresos ${fmt(s[i].ing)}</title></circle>`);
 return `<div class="chart">${o}</svg></div><div class="legend" style="margin-top:8px"><span><i style="background:#7b6dff"></i>Egresos (gastos, costos e inversiones)</span><span><i style="background:#24d6a5"></i>Ingresos por oro (inversionista)</span></div>`;
}
function alerts(){
 const a=[];const t=today(),lim=addDays(t,30);
 L('veh').forEach(v=>[['soat','SOAT'],['tr','Seguro todo riesgo'],['tecno','Tecnomecánica']].forEach(([k,l])=>{const d=v[k];if(!d)a.push(['',`${v.placa}: falta la fecha de vencimiento de ${l}.`]);else if(d<t)a.push(['ba',`${v.placa}: ${l} vencido desde ${fd(d)}.`]);else if(d<=lim)a.push(['',`${v.placa}: ${l} vence el ${fd(d)}.`])}));
 const {f}=retroPeriodo();const R=retroCalc(f,'');if(R.bajo)a.push(['',`Retroexcavadora: ${R.bajo} días por debajo de ${S.retroP.min} horas en el periodo actual.`]);
 const ant=sum(L('per').filter(p=>p.sc==='mina'),p=>anticiposPend(p.id));if(ant)a.push(['',`Mina: ${fmt(ant)} en anticipos por descontar en el próximo corte.`]);
 const pend=minaPendiente();if(pend)a.push(['ba',`Mina: ${fmt(pend)} en costos aún sin cubrir con cortes de oro.`]);
 L('inm').forEach(i=>{const ej=sum(L('mov').filter(r=>r.p==='inm'&&r.inm===i.id));if(i.pres&&ej>i.pres*.9)a.push([ej>i.pres?'ba':'',`${i.nombre}: ejecutado ${(ej/i.pres*100).toFixed(0)}% del presupuesto.`])});
 if(S.outbox.length)a.push(['',`${S.outbox.length} cambios guardados en este equipo esperan sincronizar con Drive.`]);
 return a;
}

 <h3 style="margin-top:18px">Accesos rápidos</h3><div class="bar edit-only"><button class="btn sm" data-act="newCorteGo">${ic('gem')}Lavado de oro</button><button class="btn sm" data-act="newPrest">${ic('coin')}Prestar</button><button class="btn sm" data-act="newAbono">${ic('cash')}Recibir abono</button><button class="btn sm" data-act="newRh">${ic('dig')}Horas retro</button><button class="btn sm" data-act="quick">${ic('plus')}Otro gasto</button></div></div></div>`;
}

let FORM=null;
function openForm(o){
 FORM=o;
 const fld=f=>{const id='f_'+f.k;const v=f.v??'';let inp='';
  if(f.t==='select')inp=`<select id="${id}" ${f.req?'required':''}>${f.blank?`<option value="">${f.blank}</option>`:''}${f.opts.map(x=>{const[val,lab]=Array.isArray(x)?x:[x,x];return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
  else if(f.t==='money')inp=`<input id="${id}" inputmode="numeric" data-money placeholder="$0" value="${v!==''?Math.round(v).toLocaleString('es-CO'):''}" ${f.req?'required':''}>`;
  else if(f.t==='dec')inp=`<input id="${id}" inputmode="decimal" placeholder="${f.ph||'0'}" value="${v!==''?String(v).replace('.',','):''}" ${f.req?'required':''}>`;
  else if(f.t==='area')inp=`<textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else if(f.t==='photo')inp=`<div class="photo"><label class="btn sm" for="${id}">${ic('cam')}${o.rec?.[f.k]?'Cambiar soporte':'Foto o archivo del soporte'}</label><input type="file" id="${id}" accept="image/*,application/pdf" capture="environment" hidden><span class="mut" id="${id}_n">${esc(o.rec?.fotoN||'')}</span></div>`;
  else if(f.t==='checks')inp=`<div class="checks" id="${id}">${f.opts.map(([val,lab])=>`<label><input type="checkbox" value="${esc(val)}" ${(v||[]).includes(val)?'checked':''}>${esc(lab)}</label>`).join('')}</div>`;
  else if(f.t==='html')return `<div class="fld w" id="${id}">${f.html}</div>`;
  else inp=`<input id="${id}" type="${f.t||'text'}" ${f.t==='text'||!f.t?'autocomplete="off"':''} placeholder="${esc(f.ph||'')}" value="${esc(v)}" ${f.req?'required':''} ${f.list?`list="${id}_l"`:''}>${f.list?`<datalist id="${id}_l">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`;
  return `<div class="fld ${f.w?'w':''}"><label for="${id}">${f.l}${f.req?' *':''}</label>${inp}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`};
 $('#sheet').innerHTML=`<div class="sh"><h2>${esc(o.title)}</h2><button class="ib" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>
 <form id="frm" novalidate><div class="sbd">${o.top||''}<div class="fg">${o.fields.map(fld).join('')}</div>${o.preview?'<div class="prev" id="prev"></div>':''}</div>
 <div class="sft"><button type="button" class="btn gh" data-act="close">Cancelar</button><button type="submit" class="btn pri">${esc(o.ok||'Guardar')}</button></div></form>`;
 $('#modal').hidden=false;
 const frm=$('#frm');
 frm.addEventListener('submit',async e=>{e.preventDefault();const vals=readForm();const miss=o.fields.find(f=>f.req&&(vals[f.k]===''||vals[f.k]==null||(['money','dec'].includes(f.t)&&!vals[f.k])));
  if(miss){toast('Falta: '+miss.l);$('#f_'+miss.k)?.focus();return}
  const ph=o.fields.find(f=>f.t==='photo');if(ph){const fi=$('#f_'+ph.k);if(fi.files[0]){try{const fid=uid();const data=await compress(fi.files[0]);await DB.put('files',fid,{name:fi.files[0].name,data});vals[ph.k]=fid;vals.fotoN=fi.files[0].name}catch(err){toast('No se pudo leer el archivo del soporte')}}else{delete vals[ph.k]}}
  const msg=o.save(vals);closeModal();render();toast(msg||'Guardado')});
 frm.addEventListener('input',e=>{if(e.target.matches('[data-money]'))moneyMask(e.target);if(o.onInput)o.onInput(readForm())});
 frm.addEventListener('change',e=>{if(e.target.type==='file'){const n=$('#'+e.target.id+'_n');if(n)n.textContent=e.target.files[0]?.name||''}if(o.onInput)o.onInput(readForm())});
 if(o.onInput)o.onInput(readForm());
 setTimeout(()=>{const first=frm.querySelector('input:not([type=date]):not([type=file]),select');if(first&&window.innerWidth>640)first.focus()},50);
}
function moneyMask(el){const d=el.value.replace(/\D/g,'');el.value=d?(+d).toLocaleString('es-CO'):''}
function readForm(){const o={};FORM.fields.forEach(f=>{const el=$('#f_'+f.k);if(!el)return;
 if(f.t==='money')o[f.k]=+(el.value.replace(/\D/g,''))||0;else if(f.t==='dec')o[f.k]=num(el.value);else if(f.t==='checks')o[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);else if(f.t==='photo'||f.t==='html')o[f.k]=FORM.rec?.[f.k];else o[f.k]=el.value.trim()});return o}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';FORM=null}
async function compress(file){
 const rd=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
 if(!file.type.startsWith('image/'))return rd(file);
 const url=URL.createObjectURL(file);
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
 const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.72);
}

let DLNS;const dlNs=()=>DLNS??=(window.claude?.use?window.claude.use('downloads').catch(()=>null):Promise.resolve(null));

 if(ns){try{await ns.save({filename:name,data:blob});toast('Archivo guardado: '+name)}catch(e){toast(e?.code==='declined'?'Descarga cancelada':'No se pudo guardar el archivo en esta vista')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Descargando '+name)}

function rangeNow(){return [V.f.rf||(new Date().getFullYear()+'-01-01'),V.f.rt||today()]}
function reportText(){const [f,t]=rangeNow();const R=report(f,t);const T=R.T;
 return `INFORME FINANCIERO ${fd(f)} - ${fd(t)}\n\n`+R.rows.map(r=>`${r.name}\n  Ingresos ${fmt(r.ing)} | Gastos ${fmt(r.gas)} | Costos ${fmt(r.cos)} | Inversiones ${fmt(r.inv)} | Resultado ${fmt(r.util)}`).join('\n')+
 `\n\nCONSOLIDADO\n  Ingresos ${fmt(T.ing)}\n  Gastos ${fmt(T.gas)}\n  Costos ${fmt(T.cos)}\n  Inversiones ${fmt(T.inv)}\n  Resultado neto ${fmt(T.util)}\n\nPRÉSTAMOS\n  Prestado ${fmt(R.pr.col)} | Recuperado ${fmt(R.pr.rec)} | Saldo por cobrar ${fmt(R.pr.saldo)}`}
const loadJs=u=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${u}"]`))return res();const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+u));document.head.appendChild(s)});

 const [f,t]=rangeNow();const R=report(f,t);const wb=XLSX.utils.book_new();
 const res=[['Informe financiero',`${fd(f)} - ${fd(t)}`],[],['Proyecto','Ingresos','Gastos','Costos','Inversiones','Resultado']].concat(R.rows.map(r=>[r.name,r.ing,r.gas,r.cos,r.inv,r.util]),[['Consolidado',R.T.ing,R.T.gas,R.T.cos,R.T.inv,R.T.util],[],['Préstamos: prestado',R.pr.col],['Préstamos: recuperado',R.pr.rec],['Préstamos: saldo por cobrar',R.pr.saldo]]);
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(res),'Resumen');
 const inmN=id=>byId('inm',id)?.nombre||'';

 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L('prest').map(p=>({Fecha:fd(p.fecha),Nombre:p.nombre,Cédula:p.cedula,Valor:p.valor,Abonos:p.valor-saldoPrest(p),Saldo:saldoPrest(p),Nota:p.nota||''}))),'Préstamos');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L('cortes').flatMap(c=>c.liq.map(l=>({Corte:fd(c.fecha),Gramos_corte:c.gramos,Precio_g:c.precio,Beneficiario:l.label,Nombre:l.nombre,Porcentaje:l.pct,Gramos:l.g,Valor:l.cop,Anticipos_desc:l.desc,Neto:l.neto})))),'Cortes oro');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L('rh').map(r=>({Fecha:fd(r.fecha),Inicio:r.hi,Final:r.hf,Horas:r.horas,Valor:r.horas*S.retroP.precio,Operador:r.operador,Novedad:r.obs}))),'Retro horas');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L('rs').map(r=>({Fecha:fd(r.fecha),Tipo:r.tipo,Concepto:r.concepto,Valor:r.valor,Asume:r.asume}))),'Retro salidas');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L('rc').map(r=>({Fecha:fd(r.fecha),Tipo:r.tipo,Cantidad:r.cant,Unidad:r.und,Valor:r.valor}))),'Retro combustible');
 const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});dl(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`informe-financiero-${f}-a-${t}.xlsx`);

async function exportPdf(){
 try{await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js')}catch(e){toast('Se necesita internet la primera vez para generar PDF');return}
 const [f,t]=rangeNow();const R=report(f,t);const doc=new jspdf.jsPDF({unit:'pt',format:'letter'});
 doc.setFontSize(16);doc.text('Informe financiero',40,48);doc.setFontSize(10);doc.text(`Periodo ${fd(f)} - ${fd(t)} · generado ${new Date().toLocaleString('es-CO')}`,40,66);
 const st={headStyles:{fillColor:[19,27,77]},styles:{fontSize:9},columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}}};
 doc.autoTable(Object.assign({startY:82,head:[['Proyecto','Ingresos','Gastos','Costos','Inversiones','Resultado']],body:R.rows.map(r=>[r.name,fmt(r.ing),fmt(r.gas),fmt(r.cos),fmt(r.inv),fmt(r.util)]),foot:[['Consolidado',fmt(R.T.ing),fmt(R.T.gas),fmt(R.T.cos),fmt(R.T.inv),fmt(R.T.util)]]},st));
 const body=[];R.rows.forEach(r=>Object.entries(r.subs).forEach(([k,v])=>body.push([r.name,k,fmt(v)])));
 doc.autoTable({startY:doc.lastAutoTable.finalY+20,head:[['Proyecto','Rubro','Valor']],body,headStyles:{fillColor:[19,27,77]},styles:{fontSize:9},columnStyles:{2:{halign:'right'}}});
 doc.autoTable({startY:doc.lastAutoTable.finalY+20,head:[['Préstamos','Valor']],body:[['Prestado en el periodo',fmt(R.pr.col)],['Recuperado en el periodo',fmt(R.pr.rec)],['Saldo por cobrar',fmt(R.pr.saldo)]],headStyles:{fillColor:[19,27,77]},styles:{fontSize:9},columnStyles:{1:{halign:'right'}}});
 dl(doc.output('blob'),`informe-financiero-${f}-a-${t}.pdf`);
}

const COLLS=['mov','prest','abonos','cab','veh','inm','per','cortes','rh','rs','rc','rcort'];
async function sync(manual){
 if(SYNCING)return;
 if(!S.cfg.url){if(manual){toast('Falta el enlace de sincronización');go('ajustes')}return}
 if(!navigator.onLine){if(manual)toast('Sin señal. Los cambios quedan guardados en este equipo.');return}
 SYNCING=true;renderStatus();
 try{
  const sent=S.outbox.slice();
  const changes=sent.map(o=>o.c==='retroP'?{c:'retroP',rec:Object.assign({id:'retroP'},S.retroP)}:{c:o.c,rec:byId(o.c,o.id)}).filter(x=>x.rec);
  const r=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op:'sync',token:S.cfg.token,device:S.cfg.device,since:S.lastSync||0,changes})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Error del servidor');
  (j.changes||[]).forEach(x=>{if(x.c==='retroP'){if((x.rec.upd||0)>(S.retroP.upd||0))Object.assign(S.retroP,x.rec);return}if(!COLLS.includes(x.c))return;const cur=byId(x.c,x.rec.id);if(!cur)S[x.c].push(x.rec);else if((x.rec.upd||0)>(cur.upd||0))Object.assign(cur,x.rec)});
  S.outbox=S.outbox.filter(o=>!sent.some(s=>s.c===o.c&&s.id===o.id&&s.t===o.t));S.lastSync=j.serverTime||Date.now();save();if(manual)toast('Sincronizado con Drive');
 }catch(e){if(manual)toast('No se pudo sincronizar. Se reintentará al volver la señal.')}
 SYNCING=false;render();
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act==='close'||b.closest('#modal')||b.closest('.nav')||b.closest('.view')||b.closest('.top')||b.id==='fab'){e.preventDefault();ACT[b.dataset.act]?.(b.dataset)}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('change',e=>{
 const k=e.target.dataset.actChange;
 if(k==='rf'||k==='rt'){V.f[k]=e.target.value;render()}
 if(k==='role'){const nv=e.target.value;const need=['admin','aux'].includes(nv)&&S.cfg.pin&&!['admin','aux'].includes(S.cfg.role);
  const apply=()=>{S.cfg.role=nv;save();if(nv==='dueno')go('retro','dueno');else render();toast('Perfil: '+ROLES[nv])};
  if(need){openForm({title:'Ingresa el PIN',fields:[{k:'pin',l:'PIN',t:'password',req:1}],save:v=>{if(v.pin!==S.cfg.pin){setTimeout(render,0);return 'PIN incorrecto'}apply();return 'Acceso concedido'}})}else apply()}
 if(e.target.id==='restore'&&e.target.files[0]){const fr=new FileReader();fr.onload=async()=>{try{const d=JSON.parse(fr.result);if(!d.mov)throw 0;S=d;await DB.put('kv','state',S);render();toast('Respaldo restaurado')}catch(_){toast('El archivo no es un respaldo válido')}};fr.readAsText(e.target.files[0])}
});
document.addEventListener('input',e=>{if(e.target.matches('.view [data-money]'))moneyMask(e.target)});
$('#ham').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('open')};
$('#scrim').onclick=closeSide;
window.addEventListener('online',()=>{renderStatus();if(S.outbox.length)sync(false)});
window.addEventListener('offline',renderStatus);

/* ---------- app instalable (PWA) ---------- */
let INSTALL=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;if(V.m==='ajustes')render()});
window.addEventListener('appinstalled',()=>{INSTALL=null;toast('App instalada')});
if('serviceWorker' in navigator&&document.querySelector('link[rel=manifest]')&&(location.protocol==='https:'||location.hostname==='localhost')){
 navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Nueva versión lista. Cierra y abre la app para usarla.')})})}).catch(()=>{});
 try{navigator.storage?.persist?.()}catch(e){}
}

/* ---------- arranque ---------- */
(async()=>{
 await DB.open();
 let st=null;try{st=await DB.get('kv','state')}catch(e){}
 S=st&&st.mov?st:seed();
 if(!st)DB.put('kv','state',S);
 const h=(location.hash||'').slice(1).split('.');
 if(h[0]&&modOf(h[0]))go(h[0],h[1]);else render();
 if(navigator.onLine&&S.outbox.length&&S.cfg.url)sync(false);
 dlNs();
})();
</script>
